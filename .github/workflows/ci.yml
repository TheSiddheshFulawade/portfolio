# Spec 003 V11-01 (REQ-CI-001, REQ-CI-002): one gate for every pull request to develop and main.
# Actions are pinned by commit SHA (tag in the comment); permissions are read-only.
# scripts/checks/ci-workflow.mjs enforces these rules locally (npm run check:repo).
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm run install:web

      - name: Repo checks, hooks, scripts, lint, typecheck, unit tests, build, production audit
        run: npm run verify

      - name: Install Chromium for Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Smoke test (Playwright, Chromium)
        working-directory: apps/web
        run: npm run e2e
