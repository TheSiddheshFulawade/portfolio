    start: 'Run started: {mode}, {fault}, seed {seed}.'
    end: 'Run ended at tick {tick}.'
    POSTED: 'Tick {tick}: {id} posted.'
    REJECTED_FUNDS: 'Tick {tick}: {id} rejected for insufficient funds.'
    DUPLICATE_ANSWERED: 'Tick {tick}: a resend of {id} answered with the first outcome; no queue slot used.'
    OUTBOX_ENQUEUED: 'Tick {tick}: {id} saved to the outbox after a failed publish.'
    OUTBOX_DELIVERED: 'Tick {tick}: the relay delivered {id} from the outbox.'
    PUBLISH_FAILED: 'Tick {tick}: {source} publish of {id} failed after its retries.'
    GL_NOT_PERMITTED: 'Tick {tick}: breaker open, so the {source} publish of {id} is refused without a call.'
    BREAKER_OPEN: 'Tick {tick}: breaker open. Publishes are refused without calling the general ledger.'
    BREAKER_HALF_OPEN: 'Tick {tick}: open wait over. The next call to the general ledger, in the next tick, moves the breaker to half-open and goes through as the first probe; the third probe decides.'
    BREAKER_CLOSED: 'Tick {tick}: breaker closed.'
    DEADLOCK_DETECTED: 'Tick {tick}: deadlock. Each worker in a cycle holds a lock another one needs.'
