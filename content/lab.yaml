      flaky: Flaky general ledger
      outage: General ledger outage
  status:
    idle: Choose a mode and a fault, then run the model.
    running: Running the model.
    done: 'Run ended at tick {tick}: every transfer answered and every posting delivered to the general ledger.'
    deadlock: 'Run ended at tick {tick}: deadlock. Each worker in a cycle holds a lock another one needs, so the run never finishes and the invariants are not evaluated.'
    timeout: "Run stopped at tick {tick}: it did not finish within the model's limit, so the invariants are not evaluated."
    noDeadlock: No deadlock this time; the risk remains.
