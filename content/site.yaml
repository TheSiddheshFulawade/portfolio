# Home headline (REQ-HOME-101): `lead` + the last phrase is the complete sentence in the prerendered HTML.
# The headline may cycle once through `phrases` and must end on the last one within 5 s; screen readers
# get `srSentence`. "Designed to": PayFlow's chaos tests are not built yet, so no absolute claim.
hero:
  lead: I build payment systems designed to stay correct under
  phrases:
    - concurrent load.
    - duplicate delivery.
    - broker outages.
    - partial failure.
  srSentence: I build payment systems designed to stay correct under partial failure.
