  central banking payment systems. I design the failure path first, then test the guarantee.
bio:
  - >-
    I am a full stack Java engineer working on central banking payment systems. My day-to-day is
    Spring Boot microservices that process ISO 20022 payment messages, integrate with general
    ledger APIs for reconciliation, and fall back and recover when Kafka, a cache, SFTP or an external API fails.
  - >-
    What I care about most is correctness under concurrency and failure: a transfer should take
    effect once, money should not be created or lost, and failures should be visible rather than
    silent. Settlement Lab and PayFlow, my public projects, are where I test those ideas, with
    property-based and stress tests.
  - >-
    Before payments, I built backends for a Finland-based news startup (Azure Functions, vector
    search, GPT summaries) and for four med-tech research projects at a university lab.
