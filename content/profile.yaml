bio:
  - >-
    I am a full stack Java engineer working on central banking payment systems. My day-to-day is
    Spring Boot microservices that process ISO 20022 payment messages, reconcile against the general
    ledger, and keep working when Kafka, a cache or an external API does not.
  - >-
    What I care about most is correctness under concurrency: every transfer applied exactly once,
    no money created or lost, and failures that degrade gracefully instead of silently. Settlement Lab,
    my open-source project, is where I test those ideas in public, with property-based and stress tests.
  - >-
    Before payments, I built backends for a Finland-based news startup (Azure Functions, vector
    search, GPT summarisation) and for four research projects at IIT Bombay's NanoBios Lab.
