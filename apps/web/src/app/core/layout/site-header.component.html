<header class="header">
  <div class="bar">
    <a class="brand" routerLink="/">{{ name }}</a>

    <button
      type="button"
      class="icon-button menu-button"
      aria-controls="site-nav"
      [attr.aria-expanded]="open()"
      (click)="toggleMenu()"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
      <span class="menu-label">{{ ui['menu'] }}</span>
    </button>

    <nav id="site-nav" class="nav" [class.open]="open()" [attr.aria-label]="ui['navLabel']">
      <ul>
        @for (item of nav; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="{ exact: item.path === '/' }"
              >{{ item.label }}</a
            >
          </li>
        }
      </ul>
    </nav>

    <button
      type="button"
      class="icon-button theme-button"
      [attr.aria-label]="ui['themeToggle']"
      [attr.title]="ui['themeToggle']"
      (click)="toggleTheme()"
    >
      <!-- Both icons render; CSS shows the one for the theme you would switch to, so SSR output matches any theme. -->
      <svg class="icon-sun" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
        />
      </svg>
      <svg class="icon-moon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
        <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" />
      </svg>
    </button>
  </div>
</header>
