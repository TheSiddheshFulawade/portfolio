<footer class="footer">
  <div class="inner">
    <ul class="links">
      @for (link of profile.links; track link.id) {
        <li>
          <a [href]="link.url" rel="me noopener">{{ link.label }}</a>
        </li>
      }
      <li>
        <a [href]="'mailto:' + profile.email">{{ profile.email }}</a>
      </li>
    </ul>
    <p class="meta">
      <span class="mono">© {{ year }} {{ profile.name }}</span>
      <span>{{ footer.note }}</span>
      <a [href]="footer.sourceUrl" rel="noopener">{{ footer.sourceLabel }}</a>
    </p>
  </div>
</footer>
